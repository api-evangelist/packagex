aid: packagex
name: PackageX
description: >-
  PackageX provides vision-AI powered logistics execution — software that turns
  any camera or device into an intelligent scanning agent to automate receiving,
  inventory management, fulfillment and dispatch across warehouses, retail and
  building logistics. Its REST API and mobile Vision SDKs expose shipments,
  deliveries, tracking, addresses, containers, manifests, documents and vision
  inferences (shipping-label OCR, bill-of-lading parsing, item segmentation).
  Authentication is API-key based via the PX-API-KEY header, with separate
  sandbox and production environments. Customers include WeWork, Subaru, Ricoh,
  Medtronic, Toyota and On Running.
